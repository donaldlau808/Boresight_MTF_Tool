[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boresight-mtf-tool"
version = "1.0.3"
description = "Boresight Misalignment and MTF Analysis Tool"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "pandas",
    "openpyxl",
    "opencv-python",
    "matplotlib",
    "numpy",
    "scipy",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]